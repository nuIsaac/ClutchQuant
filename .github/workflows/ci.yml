name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clutchquant
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: clutchquant_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U clutchquant" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    env:
      TEST_DATABASE_URL: postgresql+psycopg://clutchquant:ci_only@localhost:5432/clutchquant_test
      OMP_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt -c requirements.lock
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t clutchquant-${{ matrix.app }}:ci apps/${{ matrix.app }}
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 deploy/check_demo_config.py
      - run: for file in deploy/*.sh; do sh -n "$file"; done
      - run: python3 deploy/smoke.py
